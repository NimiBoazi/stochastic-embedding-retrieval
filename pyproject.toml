[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "stochastic-embedding-retrieval"
version = "0.1.0"
description = "Reproducible evaluation of self-consistency strategies for stochastic text embeddings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ir-datasets>=0.5.9",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "pyyaml>=6.0",
  "scipy>=1.12",
  "sentence-transformers>=3.0",
  "torch>=2.2",
  "tqdm>=4.66",
  "typer>=0.12",
]

[project.optional-dependencies]
gpu = ["faiss-gpu-cu12"]
cpu-index = ["faiss-cpu>=1.8"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]

[project.scripts]
stochastic-retrieval = "stochastic_retrieval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/stochastic_retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
