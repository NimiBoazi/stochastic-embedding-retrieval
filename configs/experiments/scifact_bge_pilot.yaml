artifact_root: artifacts
device: auto
num_workers: 0

model:
  name: BAAI/bge-base-en-v1.5
  revision: null
  query_prefix: "Represent this sentence for searching relevant passages: "
  document_prefix: ""
  batch_size: 32
  max_length: 512
  normalize: true
  dropout_scope: all
  dropout_probability: null

dataset:
  name: scifact
  ir_dataset_id: beir/scifact/test
  query_limit: null
  document_limit: null

experiment:
  name: scifact-bge-pilot
  seed: 42
  query_samples: 8
  document_samples: 1
  retrieval_k: 1000
  metric_cutoffs: [10, 100, 1000]
  methods:
    - deterministic
    - mean_embedding
    - mean_score
    - medoid_embedding
    - rrf
    - majority_vote
    - oracle_best_of_n
  bootstrap_replicates: 2000

tags:
  stage: pilot
  primary_metric: ndcg@10
